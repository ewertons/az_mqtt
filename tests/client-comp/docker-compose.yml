# Performance-test infrastructure.
# Usage:
#   docker compose up -d          # start broker
#   <run perf tests>
#   docker compose down -v        # tear down

services:
  # ── MQTT broker ──────────────────────────────────────────────
  emqx:
    image: emqx/emqx:latest
    hostname: emqx
    container_name: perf-emqx
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 0.0.0.0
      # Bump internal limits for stress testing
      EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS: "infinity"
      EMQX_LOG__CONSOLE__LEVEL: warning
    ports:
      - "1883:1883"   # MQTT TCP
      - "18083:18083"  # Dashboard + Prometheus endpoint
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── az_mqtt5 (C / OpenSSL) perf binary ───────────────────────
  perf-az-mqtt5-openssl:
    build:
      context: ../..
      dockerfile: tests/client-comp/Dockerfile.az_mqtt5_openssl
    image: perf-az-mqtt5-openssl:latest
    container_name: perf-az-mqtt5-openssl
    profiles: ["build-only"]

  # ── az_mqtt5 (C / mbedTLS) perf binary ───────────────────────
  perf-az-mqtt5-mbedtls:
    build:
      context: ../..
      dockerfile: tests/client-comp/Dockerfile.az_mqtt5_mbedtls
    image: perf-az-mqtt5-mbedtls:latest
    container_name: perf-az-mqtt5-mbedtls
    profiles: ["build-only"]

  # ── Paho MQTT C perf binary ──────────────────────────────────
  perf-paho:
    build:
      context: ../..
      dockerfile: tests/client-comp/Dockerfile.paho
    image: perf-paho:latest
    container_name: perf-paho
    profiles: ["build-only"]

  # ── azure_mqtt (Rust) perf binary ────────────────────────────
  perf-rust:
    build:
      context: .
      dockerfile: Dockerfile.rust
    image: perf-azure-mqtt:latest
    container_name: perf-rust
    profiles: ["build-only"]

# Performance-test infrastructure.
# Usage:
#   docker compose up -d          # start broker + metrics
#   <run perf tests>
#   docker compose down -v        # tear down

services:
  # ── MQTT broker ──────────────────────────────────────────────
  emqx:
    image: emqx/emqx:latest
    hostname: emqx
    container_name: perf-emqx
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 0.0.0.0
      # Bump internal limits for stress testing
      EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS: "infinity"
      EMQX_LOG__CONSOLE__LEVEL: warning
    ports:
      - "1883:1883"   # MQTT TCP
      - "18083:18083"  # Dashboard + Prometheus endpoint
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

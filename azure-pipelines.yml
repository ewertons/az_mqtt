#
# Azure DevOps CI pipeline – builds and tests az_mqtt5_client on Ubuntu 24.04 and
# Windows latest.  Mosquitto is installed natively (no Docker required).
#
# Local usage (same steps the pipeline runs):
#   Ubuntu:
#     sudo apt-get install -y mosquitto
#     sudo cp test/broker/mosquitto_notls.conf /etc/mosquitto/conf.d/test.conf
#     sudo systemctl restart mosquitto
#     cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build
#     ctest --test-dir build --output-on-failure
#
#   Windows (admin PowerShell):
#     choco install mosquitto -y --no-progress
#     Copy-Item test\broker\mosquitto_notls.conf 'C:\Program Files\mosquitto\mosquitto.conf'
#     Start-Process 'C:\Program Files\mosquitto\mosquitto.exe' -ArgumentList '-c','C:\Program Files\mosquitto\mosquitto.conf'
#     cmake -B build -G "Visual Studio 17 2022" -A x64 && cmake --build build --config Release
#     ctest --test-dir build --output-on-failure -C Release

trigger:
  branches:
    include:
      - main
      - dev/*

pr:
  branches:
    include:
      - main

stages:
# ──────────────────────────────────────────────────────────────
# Stage: Build & Test
# ──────────────────────────────────────────────────────────────
- stage: Build_and_Test
  displayName: Build & Test

  jobs:
  # ── Ubuntu 24.04 ───────────────────────────────────────────
  - job: Linux
    displayName: Ubuntu 24.04
    pool:
      vmImage: ubuntu-24.04

    steps:
    - checkout: self
      submodules: recursive

    - script: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq mosquitto
      displayName: Install Mosquitto

    - script: |
        sudo cp $(Build.SourcesDirectory)/test/broker/mosquitto_notls.conf \
              /etc/mosquitto/conf.d/test.conf
        sudo systemctl restart mosquitto
        # Verify the broker is listening
        for i in $(seq 1 10); do
          if ss -tlnp | grep -q ':1883'; then
            echo "Mosquitto ready on :1883"
            break
          fi
          echo "Waiting for Mosquitto... ($i)"
          sleep 1
        done
      displayName: Configure & start Mosquitto

    - script: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DAZ_MQTT5_BUILD_SAMPLES=OFF
        cmake --build build --config Release --parallel
      displayName: Build

    - script: |
        ctest --test-dir build --output-on-failure -C Release
      displayName: Run tests

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: cTest
        testResultsFiles: build/Testing/**/*.xml
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: false

  # ── Windows (latest) ───────────────────────────────────────
  - job: Windows
    displayName: Windows latest
    pool:
      vmImage: windows-latest

    steps:
    - checkout: self
      submodules: recursive

    - powershell: |
        choco install mosquitto -y --no-progress
      displayName: Install Mosquitto

    - powershell: |
        $mosquittoDir = "C:\Program Files\mosquitto"
        $confSrc = "$(Build.SourcesDirectory)\test\broker\mosquitto_notls.conf"

        Copy-Item $confSrc "$mosquittoDir\mosquitto.conf" -Force

        # Start Mosquitto as a background process
        Start-Process -FilePath "$mosquittoDir\mosquitto.exe" `
          -ArgumentList "-c", "$mosquittoDir\mosquitto.conf" `
          -WindowStyle Hidden

        # Wait until the port is open
        for ($i = 0; $i -lt 15; $i++) {
          $conn = Test-NetConnection -ComputerName localhost -Port 1883 -WarningAction SilentlyContinue
          if ($conn.TcpTestSucceeded) {
            Write-Host "Mosquitto ready on :1883"
            break
          }
          Write-Host "Waiting for Mosquitto... ($i)"
          Start-Sleep -Seconds 1
        }
      displayName: Configure & start Mosquitto

    - powershell: |
        cmake -B build `
          -G "Visual Studio 17 2022" -A x64 `
          -DAZ_MQTT5_BUILD_SAMPLES=OFF
        cmake --build build --config Release --parallel
      displayName: Build

    - powershell: |
        ctest --test-dir build --output-on-failure -C Release
      displayName: Run tests

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: cTest
        testResultsFiles: build\Testing\**\*.xml
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: false
